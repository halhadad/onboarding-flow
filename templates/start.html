{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow rounded-lg p-8 max-w-md mx-auto mt-12">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Begin Application</h2>
    <p class="text-gray-600 text-sm mb-6">Select your country and account type to begin.</p>

    {% if error_message %}
    <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded text-sm text-red-700">
        <strong>Error:</strong> {{ error_message }}
    </div>
    {% endif %}

    <form action="/application/start" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Country</label>
            <select name="country" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="SWEDEN">Sweden</option>
                <option value="SPAIN">Spain</option>
                <option value="POLAND">Poland</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Account type</label>
            <select name="account_type" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="private">Private individual</option>
                <option value="business">Business</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded shadow transition-colors">
            Start application
        </button>
    </form>

    <div class="mt-4 text-center">
        <a href="/resume" class="text-xs text-blue-600 hover:underline">Resume an existing application</a>
    </div>
</div>
{% endblock %}
