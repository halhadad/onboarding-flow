{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow rounded-lg p-8 max-w-md mx-auto mt-12">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Resume Session</h2>
    <p class="text-gray-600 text-sm mb-6">Continue an incomplete application saved on this device.</p>

    {% if error_message %}
    <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded text-sm text-red-700">
        {{ error_message }}
    </div>
    <a href="/" class="block w-full bg-blue-600 hover:bg-blue-700 text-white text-center font-semibold p-3 rounded shadow transition-colors">
        Start New Application
    </a>
    {% else %}
    <form action="/application/resume" method="POST">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded shadow transition-colors">
            Continue Application
        </button>
    </form>
    {% endif %}
</div>
{% endblock %}
