{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow rounded-lg p-8 max-w-md mx-auto mt-12">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Resume Session</h2>
    <p class="text-gray-600 text-sm mb-6">Enter your global application identification signature reference string.</p>
    
    <form action="/application/resume" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Application ID Reference</label>
            <input type="text" name="application_id" required placeholder="uuid-v4 string pattern" class="w-full border border-gray-300 rounded p-3 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded shadow transition-colors">
            Verify & Fetch Session
        </button>
    </form>
</div>
{% endblock %}
