<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Onboarding Core Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    <header class="bg-blue-900 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">IKANO BANK</h1>
            <span class="text-sm bg-blue-800 px-3 py-1 rounded text-blue-200">Secure Onboarding Engine</span>
        </div>
    </header>
    <main class="flex-grow max-w-4xl w-full mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-100 border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        &copy; 2026 Ikano Bank. All transactions are secure and encrypted.
    </footer>
</body>
</html>
